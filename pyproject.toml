[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graduation-project-simulation"
version = "0.1.0"
description = "Bootstrap architecture for Arabic Sign Language digital-twin research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Graduation-Project-Simulation Team" }]
dependencies = [
    "mediapipe==1.0.1",
    "numpy==2.5.2",
    "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
visualizer = ["matplotlib>=3.8"]
gui = ["PySide6>=6.8,<7"]
# TASK-009B recognition training. torch is already required by the TASK-008
# WiLoR extraction stack and is installed from the CUDA wheel index rather than
# pinned here; scikit-learn supplies the standard classification metrics and the
# classical length-only duration control.
recognition = [
    "scikit-learn>=1.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
smart_glove_app = ["qml/*.qml", "qml/components/*.qml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pose*", "video_io*", "evaluation*", "visualization*", "tracking*", "visualizer*", "recognition*", "smart_glove_app*"]
