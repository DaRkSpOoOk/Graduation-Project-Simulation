[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graduation-project-simulation"
version = "0.1.0"
description = "Bootstrap architecture for Arabic Sign Language digital-twin research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Graduation-Project-Simulation Team" }]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pose*"]
